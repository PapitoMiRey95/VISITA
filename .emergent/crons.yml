crons:
  - name: appt-reminders
    description: "Sends due 24h-before appointment reminders via email (Resend)"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/appointment-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: rx-refill-reminders
    description: "Daily 13:00 UTC: portal reminder when a regular VIen-prescribed medicine is due within 7 days"
    cron: "0 13 * * *"
    endpoint: "{{BASE_URL}}/api/cron/refill-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: deployment-verify
    description: "Every minute: readiness verification feeding the Deployment state machine (UPDATING -> NORMAL / SERVICE_ISSUE)"
    cron: "* * * * *"
    endpoint: "{{BASE_URL}}/api/cron/deployment-verify"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
